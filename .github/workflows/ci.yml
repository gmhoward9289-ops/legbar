name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # legbar claims 3.9+ on macOS, Linux, and Windows. curses is stdlib on the
    # first two; Windows gets it from the windows-curses wheel (declared in
    # pyproject.toml, platform-gated), which is why this job installs it
    # explicitly rather than relying on the package install step alone.
    #
    # This is deliberately not a full os x python cross product. The
    # interpreter is tested on Linux, where a leg costs seconds: 3.9 is the
    # floor, 3.13 is what the Homebrew formula pins, and 3.14 is what the
    # primary dev box runs (the sibling repos went months testing only 3.9 and
    # 3.13 while every local run used 3.14). The other two platforms are here
    # to prove the platform claim, not to re-test the interpreter three times:
    #
    # - macOS gets one leg, on 3.13, because that is the python@3.13 the
    #   formula installs -- the interpreter nearly every Mac user runs this
    #   under. There is no Intel leg: this is pure-Python stdlib code with no
    #   compiled dependency on macOS, so arm64 vs x86_64 cannot change a
    #   result. (macos-15-intel used to be here; six macOS legs per PR were
    #   re-running the same stdlib on the scarcest runners GitHub has.)
    # - Windows gets the floor and the ceiling, because curses there is a
    #   per-interpreter binary wheel, so each Python is a genuinely different
    #   artifact. The ceiling is 3.13, not 3.14: windows-curses wheels top out
    #   at 3.13, so a 3.14 leg would fail on dependency resolution rather than
    #   on anything in this repo. Raise it once upstream ships a wheel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install windows-curses
        if: runner.os == 'Windows'
        run: pip install windows-curses

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # Everything here must work on a box with no Claude Code, no sessions, no
      # Cursor install and no gh auth -- degradation is the contract under test.
      # A fleet dashboard that crashes on an empty fleet is worse than useless,
      # because the empty case is exactly when someone is debugging why nothing
      # is running.
      - name: Smoke test with nothing running
        shell: bash
        env:
          LEGBAR_SESSIONS_DIR: ${{ runner.temp }}/no-sessions
          LEGBAR_PROJECTS_DIR: ${{ runner.temp }}/no-projects
          LEGBAR_CURSOR_HOME: ${{ runner.temp }}/no-cursor
        run: |
          python legbar.py --version
          python legbar.py --help > /dev/null
          python legbar.py --once --no-git --no-ci
          # Workspace-relative, not /tmp: on the Windows runner bash writes
          # /tmp into Git Bash's temp while Python reads it as C:\tmp, so the
          # two disagree and the read fails on that leg alone.
          python legbar.py --json --no-git --no-ci > state.json
          python -c "import json; d=json.load(open('state.json')); assert d['sessions']==[], d['sessions']; print('empty-fleet JSON ok')"

      # henhouse is a working CLI in its own right, and legbar is only a
      # renderer over it -- so it gets its own smoke test rather than being
      # covered incidentally.
      - name: Smoke test henhouse
        shell: bash
        env:
          LEGBAR_SESSIONS_DIR: ${{ runner.temp }}/no-sessions
          LEGBAR_PROJECTS_DIR: ${{ runner.temp }}/no-projects
        run: python henhouse.py --no-git

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Stdlib-only is a promise this repo makes in its README and pyproject,
      # and the sibling repos enforce it the same way: the only third-party
      # import allowed anywhere is windows-curses, and only behind a platform
      # guard. A dependency that sneaks in is a dependency someone's locked-down
      # box will not have.
      - name: Assert stdlib-only
        run: |
          python - <<'PY'
          import ast, sys, pathlib
          ALLOWED = {"henhouse", "legbar", "curses", "_curses"}
          bad = []
          for f in ("legbar.py", "henhouse.py"):
              tree = ast.parse(pathlib.Path(f).read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for n in names:
                      if n and n not in ALLOWED and n not in sys.stdlib_module_names:
                          bad.append(f"{f}: {n}")
          if bad:
              print("non-stdlib imports found:", *bad, sep="\n  ")
              raise SystemExit(1)
          print("stdlib-only: ok")
          PY

      # The man page, package.json and the Homebrew formula all embed the
      # version as literal text. Checked here so drift fails on the PR that
      # caused it, not at release time when a stale formula would ship a
      # tarball that agrees with its own wrong version assertion.
      - name: Assert every artifact agrees on __version__
        run: bash packaging/check-version-consistency.sh

      # The apt-repo job is the only writer of gh-pages. If it stops copying
      # index.html / .nojekyll, Pages 404s the directory root even while the
      # signed repo is intact. Catch that on the PR, not the next visitor.
      - name: Assert the apt Pages landing page is still published
        run: bash packaging/check-apt-pages.sh

      - name: Assert the source stays ASCII
        # The Unicode glyph dialect ships as \u escapes on purpose: the
        # source file itself must never mojibake, wherever it is read or
        # piped, and the ASCII output dialect must never grow a stray glyph
        # in a literal that no test happens to render. The tests assert the
        # pipe-safe output paths (--once, --json) are ASCII per-line; this
        # catches the source side.
        run: |
          python - <<'PY'
          import pathlib
          for f in ("legbar.py", "henhouse.py"):
              for i, line in enumerate(pathlib.Path(f).read_text(encoding="utf-8").splitlines(), 1):
                  if not line.isascii():
                      raise SystemExit(f"{f}:{i} non-ASCII: {line.strip()[:60]}")
          print("ascii-only: ok")
          PY

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
        with:
          path: legbar.py,henhouse.py,docs,.
          skip: .git,*.pyc,__pycache__,tests/fixtures

  # The branch ruleset requires this one check instead of naming every job
  # above. Required checks match by name, and a matrix leg's name is its
  # parameters, so a matrix change silently strands the ruleset: leghorn's
  # kept demanding "test (macos-13, ...)" long after that leg was gone, and
  # every PR there sat on "Expected -- waiting for status", mergeable only
  # through admin bypass. This job's name never changes; what it asserts is
  # "every job in ci.yml succeeded".
  #
  # `if: always()` is load-bearing. Without it a failed dependency skips this
  # job, and a skipped required check shows as pending forever rather than
  # failed. The jq line then does the real gating: success only, so a
  # cancelled or skipped job fails the gate instead of slipping through as
  # merely not-a-failure.
  ci-ok:
    if: always()
    needs: [test, lint, codespell]
    runs-on: ubuntu-latest
    steps:
      - name: Every job in ci.yml succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
