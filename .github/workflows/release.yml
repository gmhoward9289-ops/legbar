name: release

# Builds the distributables for a tag, attaches them to the release, and
# publishes everywhere at once: PyPI and npm (both via OIDC trusted
# publishing, no stored tokens), the signed apt repo on gh-pages, the
# Homebrew tap, and a frozen Windows exe attached to the release. Each
# publish job fails alone; the release artifacts land either way.
#
# There is deliberately no winget job. The sibling repos (roost, leghorn) both
# carried one and both deleted it on 2026-08-11: winget-releaser cannot
# bootstrap a package identifier -- the first version has to be a hand-written
# PR merged by Microsoft's moderators -- so the job failed on every release it
# ever ran, and total downloads across every Windows asset were in single
# digits. Windows users get the frozen zip below, or `pip install legbar
# windows-curses`.
on:
  push:
    tags: ["v*"]
  # A dispatch builds and verifies; it cannot reach PyPI, npm, the Homebrew
  # tap or a GitHub Release. Every one of those is gated on a *pushed* tag --
  # `github.event_name == 'push'` as well as the ref -- because dispatch lets
  # you pick any ref, including an existing tag, so gating on the ref alone
  # would leave a button that publishes for real.
  #
  # There is deliberately no dry_run input. An earlier draft had one, defaulting
  # to true, which nothing read: dispatching against an existing tag would have
  # published to PyPI for real with the box ticked. A checkbox that lies about
  # publishing is worse than no checkbox, and PyPI has no undo.
  #
  # The two inputs that do exist are read, and each says plainly what it does.
  # publish_apt_repo is the one dispatch path that writes anywhere, and it is
  # named for it: it re-publishes the current .deb to the gh-pages apt repo and
  # touches nothing else. That is a git branch -- revertible -- which is why it
  # is allowed where a PyPI upload is not.
  workflow_dispatch:
    inputs:
      publish_apt_repo:
        description: Run the apt-repo job even without a tag (re-publish the current version to the gh-pages apt repo, without touching PyPI, npm, the tap or a release)
        type: boolean
        default: false
      npm_probe:
        description: Run only the npm job in probe mode -- diagnostics, an OIDC claim dump and a dry run. Publishes nothing.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build packaging
          python -m build

      - name: Build the .deb
        run: packaging/build-deb.sh

      # The version lives in legbar.py alone. A tag that disagrees with it
      # would publish artifacts whose filenames contradict the release they
      # hang off.
      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' legbar.py)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$code_version" != "$tag_version" ]; then
            echo "::error::tag $tag_version != __version__ $code_version" >&2
            exit 1
          fi

      - name: Check the man page, formula and package.json match __version__
        run: packaging/check-version-consistency.sh

      # PEP 440 normalises the version before it reaches the wheel filename --
      # "0.1.0-alpha" would become "0.1.0a0", so a raw string comparison
      # against __version__ fails on a perfectly valid prerelease while a
      # silent rename slips past. Compare the normalisation instead, and print
      # both so drift between the tag and what PyPI will display is visible in
      # the log rather than discovered on the project page -- or, worse, by the
      # Homebrew formula pointing at an sdist filename that was never built.
      - name: Check the wheel filename matches the normalised version
        run: |
          python - <<'PY'
          import pathlib, re, sys
          from packaging.version import Version
          code = re.search(r'^__version__ = "(.*)"', pathlib.Path("legbar.py").read_text(), re.M).group(1)
          wheel = next(pathlib.Path("dist").glob("*.whl")).name.split("-")[1]
          print(f"version / tag / deb / man : {code}")
          print(f"wheel and sdist           : {wheel}   (what PyPI will display)")
          if str(Version(code)) != wheel:
              print(f"::error::{code} normalises to {Version(code)}, but the wheel says {wheel}")
              sys.exit(1)
          if code != wheel:
              print(f"::error::PEP 440 rewrote {code} to {wheel}; the man page, formula and .deb all carry {code}, so pick a canonical version")
              sys.exit(1)
          PY

      # henhouse is imported explicitly here, not just legbar: legbar is only a
      # renderer over it, and a wheel that shipped the renderer without the
      # discovery layer would install cleanly and then fail on first launch.
      - name: Verify the built package actually runs
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          /tmp/v/bin/legbar --version
          /tmp/v/bin/python -c "import legbar, henhouse"
          /tmp/v/bin/python -m henhouse --json --no-git > /dev/null
          test -f /tmp/v/share/man/man1/legbar.1

      # The empty-fleet case is the contract legbar's CI already guards, and it
      # has to survive packaging too: henhouse must be importable *and*
      # runnable from the installed wheel, from a working directory that is not
      # the checkout. Run from /tmp so nothing resolves by accident.
      - name: Verify the installed package degrades on an empty fleet
        env:
          LEGBAR_SESSIONS_DIR: ${{ runner.temp }}/no-sessions
          LEGBAR_PROJECTS_DIR: ${{ runner.temp }}/no-projects
          LEGBAR_CURSOR_HOME: ${{ runner.temp }}/no-cursor
        run: |
          cd /tmp
          /tmp/v/bin/legbar --json --no-git --no-ci > state.json
          /tmp/v/bin/python -c "import json; d=json.load(open('state.json')); assert d['sessions']==[], d['sessions']; print('empty-fleet JSON ok')"

      - name: Verify the .deb installs and the man page is readable
        run: |
          sudo apt-get install -y ./dist/legbar_*_all.deb
          legbar --version
          man -w legbar

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      # Pushing a tag does not create a GitHub Release, so uploading straight
      # to one fails on a plain `git push --tags`. Create it if it is not there
      # and upload either way, so the tag is the only step a release needs.
      #
      # This and every publish job below require a *pushed* tag, not merely a
      # tag ref: workflow_dispatch lets you pick any ref, including an existing
      # tag, and neither creating a release nor publishing to PyPI, npm or the
      # tap should ever be reachable from a button.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Canonical PEP 440 prerelease spellings only -- aN / bN / rcN. The
          # repo does not use -alpha or .beta forms precisely because they are
          # not what ends up on the wheel.
          prerelease=""
          case "$GITHUB_REF_NAME" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Publishes the tagged build to PyPI via trusted publishing (OIDC): PyPI
  # trusts this repo's release.yml through the "pypi" environment, so no API
  # token exists anywhere -- not in secrets, not on a laptop.
  #
  # One-time setup this job depends on and cannot do for itself: register a
  # pending Trusted Publisher on PyPI for the project "legbar", pointing at
  # gmhoward9289-ops/legbar, workflow release.yml, environment "pypi" (create
  # the GitHub Environment too; unprotected is fine). Until then this job
  # fails alone and the rest of the release still lands.
  #
  # This is the ONLY PyPI upload path in the repo. PR #3 landed the same job
  # in the same file while this branch was open; the two were merged rather
  # than kept side by side, because two jobs uploading the same wheel would
  # race and the loser would fail on "file already exists". The claims a
  # PyPI Trusted Publisher matches -- repository, workflow file release.yml,
  # environment pypi -- are identical either way, so no PyPI-side setup
  # changes. What survives from #3 is folded into the build job above: the
  # packaging-based PEP 440 normalisation check, the empty-fleet run against
  # the installed wheel, and --prerelease on release creation.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Drop the .deb -- PyPI takes wheels and sdists only
        run: rm -f dist/*.deb
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Publishes the tagged build to npm as "legbar" via trusted publishing
  # (OIDC), the same no-token pattern as the pypi job. Needs npm CLI >=
  # 11.5.1, which actions/setup-node's bundled npm can lag behind.
  #
  # One-time setup this job depends on and cannot do for itself: on
  # https://www.npmjs.com/package/legbar/access (after the first manual
  # publish, or via a placeholder publish), add a Trusted Publisher ->
  # GitHub Actions pointing at gmhoward9289-ops/legbar, workflow file
  # release.yml, environment "npm" (create that GitHub Environment here too).
  # Until that's registered, this job fails alone; PyPI and apt still publish.
  #
  # The probe path is the only way a dispatch reaches this job, and it runs
  # `npm publish --dry-run` only -- see the step gates below. A real publish
  # needs a pushed tag, same as pypi.
  npm:
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || inputs.npm_probe
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # No registry-url here, deliberately. Giving setup-node a registry-url
      # makes it write an .npmrc containing
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and nothing in this repo sets NODE_AUTH_TOKEN -- trusted publishing
      # is the whole point, there is no token. The placeholder expands to an
      # empty string, npm decides it is already configured for auth, and
      # never performs the OIDC exchange: it publishes unauthenticated and
      # the registry answers 404 (npm reports unauthorized writes to an
      # existing package as 404, not 401). That is exactly what failed
      # leghorn's v0.1 and v0.2. registry.npmjs.org is npm's default anyway,
      # so dropping this loses nothing. Do not add it back without also
      # setting NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # OIDC trusted publishing needs npm >= 11.5.1; node 22 still ships 10.x.
      - run: npm install -g npm@latest
      # Diagnostics: if this job ever fails, the log should say plainly which
      # npm ran and whether an auth line was planted, instead of leaving it to
      # be inferred from the absence of OIDC output.
      - name: Publish environment
        run: |
          echo "npm version: $(npm --version)"
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- .npmrc (values masked) ---"
            sed 's/=.*/=<redacted>/' "$NPM_CONFIG_USERCONFIG"
          else
            echo "no userconfig .npmrc present (expected: OIDC path is clear)"
          fi

      # Probe only. Mints the same GitHub OIDC token npm would request and
      # prints its claims -- never the token itself. Those claims are exactly
      # what npmjs.com matches a Trusted Publisher against, so a mismatch
      # between repository/workflow_ref/environment here and what is
      # registered on the package is the whole failure, visible before a
      # release depends on it.
      - name: Probe -- mint an OIDC token and show its claims
        if: inputs.npm_probe
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset -- id-token: write is not in effect"
            exit 1
          fi
          code=$(curl -sS -o /tmp/oidc.json -w '%{http_code}' \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")
          echo "id-token request: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::could not mint an id-token for the npm audience"
            exit 1
          fi
          python3 - <<'PY'
          import base64, json
          claims = json.load(open("/tmp/oidc.json"))["value"].split(".")[1]
          claims += "=" * (-len(claims) % 4)
          c = json.loads(base64.urlsafe_b64decode(claims))
          print("--- OIDC claims npmjs.com will match against ---")
          for k in ("iss", "aud", "repository", "workflow_ref", "environment", "ref"):
              print(f"  {k}: {c.get(k)}")
          PY

      - name: Probe -- pack without publishing
        if: inputs.npm_probe
        run: npm publish --dry-run

      # Belt and braces: the job gate above already requires a pushed tag for
      # any non-probe run, but this is the step that actually writes to the
      # registry, so it restates the condition rather than inheriting it.
      - name: Publish
        if: ${{ !inputs.npm_probe && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
        run: npm publish

  # Publishes the .deb into a real, signed apt repo hosted on this repo's
  # GitHub Pages (gh-pages branch), so users get `sudo apt install legbar`
  # and `apt upgrade` instead of a one-shot manual .deb download.
  #
  # Signing key: a dedicated, sign-only key (not a personal key), imported
  # from the LEGBAR_APT_GPG_PRIVATE_KEY secret, and published as
  # legbar-archive-keyring.asc at the site root so `curl | gpg --dearmor`
  # gets exactly what signed the Release file. Rotating it means: generate a
  # new key, replace the secret, tell existing users to re-import.
  #
  # leghorn keeps the public half checked in at packaging/apt/pubkey.asc as the
  # master copy and copies that file. legbar's key does not exist yet, and a
  # placeholder pubkey.asc would be worse than none: users would curl it, get
  # something that is not the signing key, and `apt update` would fail with a
  # NO_PUBKEY error pointing at a file that looks correct. So the public half
  # is exported from the imported private key instead, and the checked-in copy
  # -- once there is one -- is treated as an assertion to verify against rather
  # than the source. That way adding packaging/apt/pubkey.asc later is a pure
  # tightening, and a mismatched pair fails loudly at release time rather than
  # silently at every user's `apt update`.
  #
  # Requires the gh-pages branch to already exist (bootstrapped once,
  # separately -- this job only ever updates it, never creates it) and GitHub
  # Pages to be enabled for the repo pointed at that branch.
  apt-repo:
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || inputs.publish_apt_repo
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          path: src

      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install apt repo tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LEGBAR_APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          fpr=$(echo "$GPG_PRIVATE_KEY" | gpg --batch --import-options show-only --import --with-colons 2>/dev/null | awk -F: '/^fpr:/{print $10; exit}')
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYFPR=$fpr" >> "$GITHUB_ENV"

      - name: Add the new .deb to the pool
        run: |
          deb=$(ls dist/*_all.deb)
          install -D -m 0644 "$deb" "gh-pages/pool/main/l/legbar/$(basename "$deb")"

      - name: Publish the signing key alongside the repo
        run: |
          gpg --batch --yes --armor --export "$KEYFPR" > gh-pages/legbar-archive-keyring.asc
          # If a master copy has been checked in, it must be this key. A repo
          # signed by one key while advertising another is the failure mode
          # this guard exists for, and it is invisible until a user's
          # `apt update` reports NO_PUBKEY.
          if [ -f src/packaging/apt/pubkey.asc ]; then
            checked_in=$(gpg --batch --import-options show-only --import --with-colons < src/packaging/apt/pubkey.asc 2>/dev/null | awk -F: '/^fpr:/{print $10; exit}')
            if [ "$checked_in" != "$KEYFPR" ]; then
              echo "::error::packaging/apt/pubkey.asc is $checked_in but the signing key is $KEYFPR" >&2
              exit 1
            fi
          fi

      - name: Rebuild the package index
        working-directory: gh-pages
        run: |
          mkdir -p dists/stable/main/binary-all
          apt-ftparchive packages pool > dists/stable/main/binary-all/Packages
          gzip -9fk dists/stable/main/binary-all/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=legbar \
            -o APT::FTPArchive::Release::Label=legbar \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=all \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="one screen for the whole fleet: live agent sessions beside GitHub CI" \
            release dists/stable > dists/stable/Release

      - name: Sign the release
        working-directory: gh-pages
        run: |
          gpg --batch --yes --default-key "$KEYFPR" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --default-key "$KEYFPR" -abs -o dists/stable/Release.gpg dists/stable/Release

      - name: Verify the signature the way apt will
        run: gpg --verify gh-pages/dists/stable/InRelease

      - name: Commit and push
        working-directory: gh-pages
        run: |
          git config user.name "legbar-release-bot"
          git config user.email "dev@swamplink.com"
          git add -A
          git commit -m "Publish $GITHUB_REF_NAME" || echo "nothing changed"
          git push origin gh-pages

      - name: Discard the imported private key
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg"

  # Builds a Windows executable and attaches it to the release, so Windows
  # users have something other than a bare .py script to grab -- and, since
  # there is no winget package and npm refuses to install on win32, this zip
  # and `pip install legbar windows-curses` are the only two Windows paths.
  #
  # --onedir rather than --onefile: onefile re-extracts to %TEMP% on every
  # launch, which is bad for a TUI people leave open on a second monitor, and
  # is the specific shape that trips AV heuristics. Shipped as a zip.
  #
  # windows-curses has to be installed before the build, same as the test job
  # in ci.yml -- PyInstaller freezes whatever `import curses` resolves to at
  # build time, and henhouse.py comes along automatically since legbar.py
  # imports it directly (no --add-data needed for a sibling module).
  windows-exe:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the onedir bundle
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller windows-curses
          pyinstaller --onedir --name legbar --console legbar.py

      - name: Smoke test the frozen exe
        shell: bash
        run: dist/legbar/legbar.exe --version

      - name: Zip the bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist/legbar && 7z a "../legbar-${version}-windows-x64.zip" .)
          echo "ZIP=dist/legbar-${version}-windows-x64.zip" >> "$GITHUB_ENV"

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber

  # Publishes packaging/legbar.rb (this repo's master copy) into the tap repo
  # (gmhoward9289-ops/homebrew-tap) as Formula/legbar.rb, with a freshly
  # computed sha256 for this tag's release tarball -- a manual checksum
  # refresh is exactly how roost's v0.2 tarball once shipped from a formula
  # that still read 0.2 and passed its own version assertion anyway.
  #
  # One-time setup this job depends on and cannot do for itself: a
  # TAP_PUSH_TOKEN secret on this repo -- a fine-grained PAT scoped to
  # gmhoward9289-ops/homebrew-tap with Contents: Read and write. The default
  # GITHUB_TOKEN only carries permission inside this repo, not a second one.
  homebrew-tap:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (for packaging/legbar.rb)
        uses: actions/checkout@v7
        with:
          path: src

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: gmhoward9289-ops/homebrew-tap
          ref: master
          path: tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Points at the sdist already uploaded to the GitHub Release by the
      # "Attach to the release" step above, not GitHub's auto-generated
      # archive/refs/tags/ URL -- that URL isn't a release asset at all, so
      # GitHub doesn't count `brew install` downloads in the repo's release
      # download_count the way it does for the .deb/.whl assets.
      - name: Compute the release asset checksum
        run: |
          sdist=$(ls dist/*.tar.gz)
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/$(basename "$sdist")"
          sha256=$(sha256sum "$sdist" | cut -d' ' -f1)
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "SHA256=$sha256" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write the formula with this release's url, checksum, and version
        run: |
          sed -e "s#^  url \".*\"#  url \"$URL\"#" \
              -e "s#^  sha256 \".*\"#  sha256 \"$SHA256\"#" \
              -e "s#^  version \".*\"#  version \"$VERSION\"#" \
              src/packaging/legbar.rb > tap/Formula/legbar.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "legbar-release-bot"
          git config user.email "dev@swamplink.com"
          git add Formula/legbar.rb
          git diff --cached --quiet && echo "nothing changed" || git commit -m "legbar $GITHUB_REF_NAME"
          git push origin master
