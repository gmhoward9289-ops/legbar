[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legbar"
dynamic = ["version"]
description = "One screen for the whole fleet: live agent sessions beside GitHub CI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "George M. Howard", email = "dev@swamplink.com" }]
keywords = ["claude", "cursor", "tui", "dashboard", "ci", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
# Standard library only, on purpose: this is a tool you leave running on a
# machine you are already debugging, and a dependency tree is one more thing
# that can be the reason it will not start.
dependencies = []

[project.urls]
Homepage = "https://github.com/gmhoward9289-ops/legbar"
Issues = "https://github.com/gmhoward9289-ops/legbar/issues"

[project.scripts]
legbar = "legbar:main"

# One source of truth for the version: __version__ in legbar.py, which is also
# what `legbar --version` prints.
[tool.hatch.version]
path = "legbar.py"

# henhouse.py is the discovery layer legbar imports; the two ship together in
# every channel because legbar is only a renderer.
[tool.hatch.build.targets.wheel]
only-include = ["legbar.py", "henhouse.py"]
