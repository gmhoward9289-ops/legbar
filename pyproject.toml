[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legbar"
dynamic = ["version"]
description = "One screen for the whole fleet: live agent sessions beside GitHub CI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "George M. Howard", email = "dev@swamplink.com" }]
keywords = ["claude", "cursor", "tui", "dashboard", "ci", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
# Standard library only, on purpose: this is a tool you leave running on a
# machine you are already debugging, and a dependency tree is one more thing
# that can be the reason it will not start.
#
# The one exception is Windows, where `curses` is not in the stdlib at all.
# windows-curses is a drop-in backed by PDCurses. Platform-gated, so macOS and
# Linux still install with nothing. Its wheels currently top out at 3.13, so a
# Windows install on 3.14 will fail to resolve until upstream catches up --
# that is a windows-curses gap, not something requires-python should cap here,
# since capping would also needlessly restrict macOS and Linux.
dependencies = ["windows-curses; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/gmhoward9289-ops/legbar"
Issues = "https://github.com/gmhoward9289-ops/legbar/issues"

[project.scripts]
legbar = "legbar:main"

# One source of truth for the version: __version__ in legbar.py, which is also
# what `legbar --version` prints.
[tool.hatch.version]
path = "legbar.py"

# henhouse.py is the discovery layer legbar imports; the two ship together in
# every channel (wheel, deb, brew libexec, npm) because legbar is only a
# renderer.
[tool.hatch.build.targets.wheel]
only-include = ["legbar.py", "henhouse.py"]

[tool.hatch.build.targets.wheel.shared-data]
"legbar.1" = "share/man/man1/legbar.1"

# The sdist is not just a PyPI artifact here: it is the tarball the Homebrew
# formula downloads, so it has to carry the man page the formula installs and
# the packaging scripts a rebuild needs.
[tool.hatch.build.targets.sdist]
include = ["legbar.py", "henhouse.py", "legbar.1", "README.md", "LICENSE", "tests/", "packaging/"]
